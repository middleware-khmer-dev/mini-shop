<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mini Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/css/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <div class="app__bg" aria-hidden="true">
      <span class="blob blob--1"></span>
      <span class="blob blob--2"></span>
    </div>

    <main class="card" role="main">
      <header class="brand">
        <div class="brand__logo">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 7V6a6 6 0 1 1 12 0v1h1.5a1 1 0 0 1 1 .9l1.2 12A2 2 0 0 1 19.7 22H4.3a2 2 0 0 1-2-2.1l1.2-12a1 1 0 0 1 1-.9H6Zm2 0h8V6a4 4 0 1 0-8 0v1Zm-2 3a1 1 0 1 0 2 0v-1H6v1Zm10 0a1 1 0 1 0 2 0v-1h-2v1Z" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="brand__title">Mini Shop</h1>
        <p class="brand__subtitle">ទិញឥវ៉ាន់ងាយស្រួល ទាន់ចិត្ត ទាន់ពេល</p>
      </header>

      <nav class="tabs" role="tablist" aria-label="Auth tabs">
        <button class="tabs__btn is-active" id="tabLogin" role="tab" aria-selected="true" aria-controls="panelLogin">ចូលប្រើប្រាស់</button>
        <button class="tabs__btn" id="tabRegister" role="tab" aria-selected="false" aria-controls="panelRegister">បង្កើតគណនី</button>
        <span class="tabs__indicator" id="tabsIndicator" aria-hidden="true"></span>
      </nav>

      <!-- LOGIN -->
      <section class="panel is-active" id="panelLogin" role="tabpanel" aria-labelledby="tabLogin">
        <form class="form" id="loginForm" novalidate>
          <label class="field">
            <span class="field__label">លេខទូរស័ព្ទ</span>
            <div class="field__control">
              <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.36 2.3.56 3.5.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.56 3.5a1 1 0 0 1-.25 1L6.6 10.8Z" fill="currentColor"/></svg>
              <input type="tel" inputmode="tel" placeholder="0XX XXX XXX" name="phone" autocomplete="tel" required />
            </div>
          </label>

          <label class="field">
            <span class="field__label">ពាក្យសម្ងាត់</span>
            <div class="field__control">
              <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z" fill="currentColor"/></svg>
              <input type="password" placeholder="បញ្ចូលពាក្យសម្ងាត់" name="password" autocomplete="current-password" required />
              <button type="button" class="field__toggle" data-toggle-password aria-label="បង្ហាញពាក្យសម្ងាត់">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5c-5.5 0-9.3 4.4-10.6 6.3a1.4 1.4 0 0 0 0 1.4C2.7 14.6 6.5 19 12 19s9.3-4.4 10.6-6.3a1.4 1.4 0 0 0 0-1.4C21.3 9.4 17.5 5 12 5Zm0 11a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z" fill="currentColor"/></svg>
              </button>
            </div>
          </label>

          <div class="form__row">
            <label class="checkbox">
              <input type="checkbox" name="remember" />
              <span>ចងចាំខ្ញុំ</span>
            </label>
            <a class="link" href="#">ភ្លេចពាក្យសម្ងាត់?</a>
          </div>

          <button type="submit" class="btn btn--primary">ចូលប្រើប្រាស់</button>

          <div class="divider"><span>ឬ</span></div>

          <button type="button" class="btn btn--telegram" id="btnTelegramLogin">
            <svg width="20" height="20" viewBox="0 0 240 240" fill="none"><circle cx="120" cy="120" r="120" fill="#fff"/><path d="M170 72 55 116c-8 3-8 8-1 10l30 9 12 37c1 4 3 5 7 2l19-14 20 15c4 3 8 1 9-4l17-99c2-7-3-10-8-8Z" fill="#229ED9"/></svg>
            ចូលដោយ Telegram
          </button>
        </form>
      </section>

      <!-- REGISTER -->
      <section class="panel" id="panelRegister" role="tabpanel" aria-labelledby="tabRegister" hidden>
        <form class="form" id="registerForm" novalidate>
          <label class="field">
            <span class="field__label">ឈ្មោះពេញ</span>
            <div class="field__control">
              <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1c0-2.8-3.6-5-8-5Z" fill="currentColor"/></svg>
              <input type="text" placeholder="ឧ. សុវណ្ណារី" name="fullname" autocomplete="name" required />
            </div>
          </label>

          <label class="field">
            <span class="field__label">លេខទូរស័ព្ទ</span>
            <div class="field__control">
              <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.36 2.3.56 3.5.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.56 3.5a1 1 0 0 1-.25 1L6.6 10.8Z" fill="currentColor"/></svg>
              <input type="tel" inputmode="tel" placeholder="0XX XXX XXX" name="phone" autocomplete="tel" required />
            </div>
          </label>

          <label class="field">
            <span class="field__label">ពាក្យសម្ងាត់</span>
            <div class="field__control">
              <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z" fill="currentColor"/></svg>
              <input type="password" placeholder="យ៉ាងហោចណាស់ ៨ តួអក្សរ" name="password" autocomplete="new-password" minlength="8" required />
              <button type="button" class="field__toggle" data-toggle-password aria-label="បង្ហាញពាក្យសម្ងាត់">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5c-5.5 0-9.3 4.4-10.6 6.3a1.4 1.4 0 0 0 0 1.4C2.7 14.6 6.5 19 12 19s9.3-4.4 10.6-6.3a1.4 1.4 0 0 0 0-1.4C21.3 9.4 17.5 5 12 5Zm0 11a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z" fill="currentColor"/></svg>
              </button>
            </div>
            <span class="field__meter" aria-hidden="true"><i id="pwMeterBar"></i></span>
          </label>

          <label class="field">
            <span class="field__label">បញ្ជាក់ពាក្យសម្ងាត់</span>
            <div class="field__control">
              <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z" fill="currentColor"/></svg>
              <input type="password" placeholder="បញ្ចូលម្តងទៀត" name="confirm" autocomplete="new-password" required />
            </div>
          </label>

          <label class="checkbox checkbox--terms">
            <input type="checkbox" name="terms" required />
            <span>ខ្ញុំយល់ព្រមតាម <a class="link" href="#">លក្ខខណ្ឌប្រើប្រាស់</a> និង <a class="link" href="#">គោលការណ៍ភាពឯកជន</a></span>
          </label>

          <button type="submit" class="btn btn--primary">បង្កើតគណនី</button>
        </form>
      </section>

      <p class="switch-line">
        <span id="switchToRegister">មិនទាន់មានគណនី? <a class="link link--strong">បង្កើតថ្មី</a></span>
        <span id="switchToLogin" hidden>មានគណនីរួចហើយ? <a class="link link--strong">ចូលប្រើប្រាស់</a></span>
      </p>
    </main>
  </div>

  <script src="src/js/app.js"></script>
</body>
</html>
