<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mini Shop &middot; កន្ត្រក</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/css/style.css" />
<link rel="stylesheet" href="src/css/shop.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="shell-body" data-page="cart">
  <div class="shell">
    <header class="topbar" style="border-radius:0 0 22px 22px;">
      <div class="topbar__row">
        <button class="icon-btn" aria-label="ត្រឡប់ក្រោយ" onclick="location.href='home.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="topbar__title">កន្ត្រករបស់ខ្ញុំ (<span id="itemCount">0</span>)</span>
        <button class="icon-btn" id="btnClearCart" aria-label="សម្អាតកន្ត្រក">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="cartContent" style="padding-bottom:100px;">
      <div id="cartList" style="display:flex; flex-direction:column; gap:12px;"></div>

      <div class="promo-row">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6M2 7h20v5H2zM12 7v13M8 7a2.5 2.5 0 0 1 0-5C10 2 12 7 12 7Zm4 0a2.5 2.5 0 0 0 0-5C14 2 12 7 12 7Z"/></svg>
        <input type="text" placeholder="បញ្ចូលកូដបញ្ចុះតម្លៃ" id="promoInput" />
        <button type="button" id="btnApplyPromo">ប្រើប្រាស់</button>
      </div>

      <section>
        <p class="pd-block-title">សេចក្តីសង្ខេបការបញ្ជាទិញ</p>
        <div class="summary">
          <div class="summary__row"><span>តម្លៃទំនិញ</span><span id="sumSubtotal">$0.00</span></div>
          <div class="summary__row summary__row--saved"><span>បានសន្សំ</span><span id="sumSaved">-$0.00</span></div>
          <div class="summary__row"><span>ថ្លៃដឹកជញ្ជូន</span><span id="sumShipping">$1.50</span></div>
          <div class="summary__row summary__row--total"><span>សរុប</span><span id="sumTotal">$0.00</span></div>
        </div>
      </section>
    </main>

    <div class="empty-cart" id="emptyCart" hidden>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <strong>កន្ត្រកទទេ</strong>
      <span>អ្នកមិនទាន់មានទំនិញក្នុងកន្ត្រកនៅឡើយទេ</span>
      <button class="btn btn--primary" onclick="location.href='catalog.html'">ចាប់ផ្តើមទិញឥវ៉ាន់</button>
    </div>

    <div class="checkoutbar" id="checkoutBar">
      <div class="checkoutbar__total">
        <span class="checkoutbar__label">សរុបទាំងអស់</span>
        <span class="checkoutbar__amount" id="barTotal">$0.00</span>
      </div>
      <button class="btn btn--primary" id="btnCheckout">ទូទាត់ប្រាក់</button>
    </div>
  </div>

  <script src="src/js/shop.js"></script>
  <script src="src/js/cart.js"></script>
</body>
</html>
