<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mini Shop &middot; កាតាឡុក</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/css/style.css" />
<link rel="stylesheet" href="src/css/shop.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="shell-body" data-page="catalog">
  <div class="shell">
    <header class="topbar">
      <div class="topbar__row">
        <button class="icon-btn icon-btn--ghost" aria-label="ត្រឡប់ក្រោយ" onclick="location.href='home.html'" style="background:rgba(255,255,255,.18);color:#fff;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="topbar__title">ទំនិញទាំងអស់</span>
        <button class="icon-btn" aria-label="កន្ត្រក" onclick="location.href='cart.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
          <span class="icon-btn__badge" id="cartBadge">2</span>
        </button>
      </div>

      <div class="searchbar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="ស្វែងរកទំនិញ, ហាង..." />
        <button class="searchbar__filter" aria-label="តម្រង" id="btnOpenFilter">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <div class="chip-scroll" id="chipList"></div>

      <div class="toolbar">
        <span id="resultCount">បង្ហាញ 8 ទំនិញ</span>
        <div class="toolbar__actions">
          <button class="pill-btn" id="btnSort">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l3-3M17 20l-3-3"/></svg>
            តម្រៀប
          </button>
          <button class="pill-btn" id="btnGrid">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
          </button>
        </div>
      </div>

      <div class="grid" id="productGrid"></div>

      <div class="empty" id="emptyState" hidden>
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <strong>រកមិនឃើញទំនិញ</strong>
        <span>សាកល្បងប្រើពាក្យគន្លឹះផ្សេង ឬប្រភេទផ្សេង</span>
      </div>
    </main>

    <nav class="bottomnav" aria-label="Main">
      <a class="navlink" data-nav="home" href="home.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>ទំព័រដើម</span>
        <i class="navlink__dot"></i>
      </a>
      <a class="navlink" data-nav="catalog" href="catalog.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>កាតាឡុក</span>
        <i class="navlink__dot"></i>
      </a>
      <a class="navlink" data-nav="cart" href="cart.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span>កន្ត្រក</span>
        <span class="navlink__badge">2</span>
        <i class="navlink__dot"></i>
      </a>
      <a class="navlink" data-nav="profile" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 6-5 8-5s6.5 1 8 5"/></svg>
        <span>គណនី</span>
        <i class="navlink__dot"></i>
      </a>
    </nav>
  </div>

  <script src="src/js/shop.js"></script>
  <script src="src/js/catalog.js"></script>
</body>
</html>
