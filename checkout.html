<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mini Shop &middot; ទូទាត់ប្រាក់</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/css/style.css" />
<link rel="stylesheet" href="src/css/shop.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="shell-body" data-page="checkout">
  <div class="shell">
    <header class="topbar" style="border-radius:0 0 22px 22px;">
      <div class="topbar__row">
        <button class="icon-btn" aria-label="ត្រឡប់ក្រោយ" onclick="location.href='cart.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="topbar__title">ទូទាត់ប្រាក់</span>
        <span style="width:38px"></span>
      </div>
    </header>

    <main class="content" style="padding-bottom:120px;">
      <section>
        <div class="section-head"><h2>អាសយដ្ឋានដឹកជញ្ជូន</h2></div>
        <div class="info-card">
          <div class="info-card__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="info-card__body">
            <div class="info-card__top">
              <span><span class="info-card__name">សុវណ្ណារី</span><span class="info-card__phone">012 345 678</span></span>
            </div>
            <p class="info-card__text">ផ្ទះលេខ 12, ផ្លូវ 271, សង្កាត់ទឹកល្អក់ទី1, ខណ្ឌទួលគោក, ភ្នំពេញ</p>
          </div>
          <button class="info-card__edit">ប្តូរ</button>
        </div>
      </section>

      <section>
        <div class="section-head"><h2>ការដឹកជញ្ជូន</h2></div>
        <div class="option-list" id="shippingOptions">
          <label class="option-card is-active" data-option="standard">
            <span class="option-card__icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="15" height="10" rx="1.5"/><path d="M16 10h3.5a1 1 0 0 1 .9.6L22 14v3h-6"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></svg>
            </span>
            <span class="option-card__body">
              <span class="option-card__title">ដឹកជញ្ជូនធម្មតា</span>
              <span class="option-card__sub">2&ndash;3 ថ្ងៃធ្វើការ</span>
            </span>
            <span class="option-card__price">$1.50</span>
            <span class="option-card__radio"></span>
          </label>
          <label class="option-card" data-option="express">
            <span class="option-card__icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-8 11h6l-1 9 8-11h-6l1-9Z"/></svg>
            </span>
            <span class="option-card__body">
              <span class="option-card__title">ដឹកជញ្ជូនលឿន</span>
              <span class="option-card__sub">ក្នុងរយៈពេល 24 ម៉ោង</span>
            </span>
            <span class="option-card__price">$4.00</span>
            <span class="option-card__radio"></span>
          </label>
        </div>
      </section>

      <section>
        <div class="section-head"><h2>វិធីទូទាត់ប្រាក់</h2></div>
        <div class="option-list" id="paymentOptions">
          <label class="option-card is-active" data-option="cod">
            <span class="option-card__icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
            </span>
            <span class="option-card__body">
              <span class="option-card__title">បង់ប្រាក់ពេលទទួលទំនិញ</span>
              <span class="option-card__sub">Cash on Delivery</span>
            </span>
            <span class="option-card__radio"></span>
          </label>
          <label class="option-card" data-option="khqr">
            <span class="option-card__icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM19 14h2M14 19h2M19 19h2"/></svg>
            </span>
            <span class="option-card__body">
              <span class="option-card__title">KHQR</span>
              <span class="option-card__sub">ស្កេនទូទាត់តាមធនាគារ</span>
            </span>
            <span class="option-card__radio"></span>
          </label>
          <label class="option-card" data-option="card">
            <span class="option-card__icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
            </span>
            <span class="option-card__body">
              <span class="option-card__title">កាតឥណទាន / ដេប៊ីត</span>
              <span class="option-card__sub">Visa, Mastercard</span>
            </span>
            <span class="option-card__radio"></span>
          </label>
        </div>
      </section>

      <section>
        <div class="section-head"><h2>ទំនិញក្នុងការបញ្ជាទិញ</h2></div>
        <div class="mini-items" id="miniItems"></div>
      </section>

      <section>
        <div class="section-head"><h2>កំណត់ចំណាំ (ស្រេចចិត្ត)</h2></div>
        <textarea class="note-field" rows="2" placeholder="ឧ. សូមទូរស័ព្ទមុនដឹក..."></textarea>
      </section>

      <section>
        <div class="summary">
          <div class="summary__row"><span>តម្លៃទំនិញ</span><span id="sumSubtotal">$0.00</span></div>
          <div class="summary__row"><span>ថ្លៃដឹកជញ្ជូន</span><span id="sumShipping">$1.50</span></div>
          <div class="summary__row summary__row--total"><span>សរុប</span><span id="sumTotal">$0.00</span></div>
        </div>
      </section>
    </main>

    <div class="checkoutbar">
      <div class="checkoutbar__total">
        <span class="checkoutbar__label">សរុបទាំងអស់</span>
        <span class="checkoutbar__amount" id="barTotal">$0.00</span>
      </div>
      <button class="btn btn--primary" id="btnPlaceOrder">បញ្ជាទិញ</button>
    </div>
  </div>

  <script src="src/js/shop.js"></script>
  <script src="src/js/checkout.js"></script>
</body>
</html>
