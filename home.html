<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mini Shop &middot; ទំព័រដើម</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/css/style.css" />
<link rel="stylesheet" href="src/css/shop.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="shell-body" data-page="home">
  <div class="shell">
    <header class="topbar">
      <div class="topbar__row">
        <div class="topbar__greet">
          <span class="topbar__hello">សួស្តី 👋</span>
          <span class="topbar__name">សុវណ្ណារី</span>
        </div>
        <div class="topbar__icons">
          <button class="icon-btn" aria-label="ការជូនដំណឹង">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="icon-btn__badge">3</span>
          </button>
          <button class="icon-btn" aria-label="កន្ត្រក" onclick="location.href='catalog.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
            <span class="icon-btn__badge" id="cartBadge">2</span>
          </button>
        </div>
      </div>

      <div class="searchbar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="ស្វែងរកទំនិញ, ហាង..." onfocus="location.href='catalog.html'" readonly />
        <button class="searchbar__filter" aria-label="តម្រង" onclick="location.href='catalog.html'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="promo">
        <span class="promo__tag">ការផ្តល់ជូនពិសេស</span>
        <h2 class="promo__title">បញ្ចុះតម្លៃរហូតដល់ 50%</h2>
        <p class="promo__sub">សម្រាប់ការបញ្ជាទិញលើកដំបូង</p>
      </section>
      <div class="promo-dots"><span class="is-active"></span><span></span><span></span></div>

      <section>
        <div class="section-head"><h2>ប្រភេទទំនិញ</h2></div>
        <div class="cat-scroll" id="catList"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>ទំនិញពេញនិយម</h2>
          <a href="catalog.html">មើលទាំងអស់</a>
        </div>
        <div class="grid" id="popularGrid"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>ថ្មីៗសម្រាប់អ្នក</h2>
          <a href="catalog.html">មើលទាំងអស់</a>
        </div>
        <div class="grid" id="newGrid"></div>
      </section>
    </main>

    <nav class="bottomnav" aria-label="Main">
      <a class="navlink" data-nav="home" href="home.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>ទំព័រដើម</span>
        <i class="navlink__dot"></i>
      </a>
      <a class="navlink" data-nav="catalog" href="catalog.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>កាតាឡុក</span>
        <i class="navlink__dot"></i>
      </a>
      <a class="navlink" data-nav="cart" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span>កន្ត្រក</span>
        <span class="navlink__badge">2</span>
        <i class="navlink__dot"></i>
      </a>
      <a class="navlink" data-nav="profile" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 6-5 8-5s6.5 1 8 5"/></svg>
        <span>គណនី</span>
        <i class="navlink__dot"></i>
      </a>
    </nav>
  </div>

  <script src="src/js/shop.js"></script>
  <script src="src/js/home.js"></script>
</body>
</html>
