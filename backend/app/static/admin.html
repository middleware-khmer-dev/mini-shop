<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece8ff">
<title>Mini Shop admin</title>
<style>
:root{--ink:#111;--soft:#6b7280;--dark:#14141f;--line:rgba(255,255,255,.8);--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.86);--violet:#7c6cf0;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#ece8ff}
body{margin:0;min-height:100vh;min-height:100dvh;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS",sans-serif;color:var(--ink);background:transparent}
/* the same pastel blobs as the shop app */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(circle at 0% 0%,#ffb4d6 0,transparent 38%),radial-gradient(circle at 100% 8%,#a9c8ff 0,transparent 40%),
  radial-gradient(circle at 100% 100%,#b9f0d8 0,transparent 42%),radial-gradient(circle at 0% 100%,#d6bcff 0,transparent 38%),#ece8ff}
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh;min-height:100dvh}
.col{min-width:0}

/* glass surfaces */
.card,#side,#bar,#tabs{background:var(--glass2);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
.card{border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 24px rgba(60,40,120,.08)}

/* phone: top bar + bottom tab bar */
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 8px) 14px 8px;border-width:0 0 1px;border-radius:0 0 22px 22px}
#side{display:none}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:6px 10px calc(var(--bot) + 8px);border-width:1px 0 0;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;color:var(--soft);padding:6px 0;border-radius:18px;font-size:11px;font-weight:600}
.tab .ic{font-size:20px;line-height:1.2}
.tab.on{color:#fff;background:rgba(20,20,31,.9)}
main{padding:16px 14px calc(96px + var(--bot));max-width:1180px;margin:0 auto;width:100%}
.brand{font-weight:800;font-size:18px;letter-spacing:-.2px}.brand small{font-weight:600;color:var(--soft);font-size:12px;margin-left:6px}

/* desktop: sidebar, wide content */
@media(min-width:900px){
  .shell{grid-template-columns:260px minmax(0,1fr)}
  #bar,#tabs{display:none}
  #side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;padding:calc(var(--top) + 24px) 16px 20px;border-width:0 1px 0 0;border-radius:0}
  #side .brand{padding:0 12px 18px;font-size:20px}
  .navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;color:var(--soft);padding:12px 14px;border-radius:16px;font-size:15px}
  .navbtn:hover{background:rgba(255,255,255,.7);color:var(--ink)}
  .navbtn.on{background:rgba(20,20,31,.9);color:#fff}
  .navbtn .ic{font-size:18px}
  main{padding:calc(var(--top) + 28px) 40px 48px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))!important}
  .cards2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}

/* page header */
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.head h1{flex:1;min-width:160px;margin:0;font-size:24px;letter-spacing:-.3px}
.sp{flex:1}

/* buttons */
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 18px;min-height:44px;background:linear-gradient(135deg,#1c1c2e,#14141f);color:#fff;cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}button:disabled{opacity:.5}
button.ghost{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06)}
button.danger{background:#fee2e2;color:#b91c1c}
button.small{min-height:34px;padding:6px 12px;font-size:13px}

/* forms */
input,textarea,select{font:inherit;font-size:16px;width:100%;padding:12px 14px;border:1px solid rgba(20,20,31,.12);border-radius:14px;background:rgba(255,255,255,.9);color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,240,.22)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px;color:#374151}
.two{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.form{max-width:760px}
select{width:auto}

/* lists */
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}.gap{display:flex;gap:8px;flex-wrap:wrap}
.title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:var(--soft);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cards2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.pcard{padding:10px;margin:0;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(60,40,120,.16)}
.pimg{height:130px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pname{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.price{font-weight:800;font-size:16px}
.orow{padding:14px 16px;margin:0;cursor:pointer;transition:transform .12s}.orow:hover{transform:translateY(-1px)}
.empty{text-align:center;padding:36px 16px;color:var(--soft)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:6px}
.img{border:1px solid rgba(20,20,31,.08);border-radius:16px;padding:6px;text-align:center;background:rgba(255,255,255,.7)}
.img img{width:100%;height:90px;object-fit:contain}.img .gap{justify-content:center;margin-top:4px}.img button{padding:4px 10px;min-height:30px}
.chip{display:inline-block;border-radius:99px;font-size:12px;font-weight:700;padding:3px 11px;background:#e5e7eb;white-space:nowrap}
.chip.pending{background:#fef3c7;color:#92400e}.chip.confirmed{background:#dbeafe;color:#1e40af}.chip.shipped{background:#ede9fe;color:#5b21b6}.chip.delivered{background:#dcfce7;color:#166534}.chip.cancelled{background:#fee2e2;color:#991b1b}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:36px;padding:7px 14px;font-size:13px}
a{color:#4f46e5}
.badge{display:inline-block;background:#14141f;color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:12px;margin:5px 0}

/* login */
body.login #side,body.login #bar,body.login #tabs{display:none}
body.login .shell{grid-template-columns:minmax(0,1fr)}
.loginwrap{min-height:calc(100dvh - 120px);display:grid;place-items:center}
.logincard{width:100%;max-width:380px;text-align:center;padding:28px 22px}
.logincard .logo{font-size:44px;line-height:1}.logincard h1{margin:8px 0 2px;font-size:24px}
.logincard label{text-align:left}

/* message toast */
#msg{display:none;position:fixed;z-index:100;left:50%;transform:translateX(-50%);top:calc(var(--top) + 12px);max-width:min(92vw,520px);padding:11px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#msg.ok{display:block;background:#dcfce7;color:#166534}#msg.err{display:block;background:#fee2e2;color:#991b1b}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,#side,#bar,#tabs{background:rgba(255,255,255,.96)}}
</style></head><body>
<div class="shell">
  <aside id="side"></aside>
  <div class="col">
    <header id="bar"></header>
    <main><div id="app"></div></main>
  </div>
</div>
<nav id="tabs"></nav>
<div id="msg" role="status"></div>
<script src="/admin/app.js"></script></body></html>
