name = "mini-shop-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# product list
[[kv_namespaces]]
binding = "DATA"
id = "773ff3115ba244f48e77d102a06cb2c5"

# product pictures
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "mini-shop-images"

# orders (database "mini-shop-orders", table in schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "mini-shop-orders"
database_id = "708005f6-a684-41eb-85bd-0f934014a803"

# at most 10 orders per minute per IP
[[unsafe.bindings]]
name = "ORDER_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# at most 60 admin requests per minute per IP
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# The admin password is a secret, not in this file:
#   npx wrangler secret put ADMIN_PASSWORD
