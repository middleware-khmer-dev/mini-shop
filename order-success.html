<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mini Shop &middot; បញ្ជាទិញជោគជ័យ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="src/js/config.js"></script>
<script src="src/js/auth.js" data-guard></script>
<link rel="stylesheet" href="src/css/style.css" />
<link rel="stylesheet" href="src/css/shop.css" />
<link rel="stylesheet" href="src/css/glass.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="shell-body" data-page="success">
  <div class="success-shell">
    <div class="success-icon">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>
    </div>
    <h1 class="success-title">បញ្ជាទិញជោគជ័យ!</h1>
    <p class="success-sub">សូមអរគុណសម្រាប់ការទិញឥវ៉ាន់! យើងនឹងរៀបចំដឹកជញ្ជូនទំនិញរបស់អ្នកក្នុងពេលឆាប់ៗនេះ។</p>

    <div class="success-card">
      <div class="success-row"><span>លេខការបញ្ជាទិញ</span><span id="orderNo">#MS-20260921</span></div>
      <div class="success-row"><span>វិធីទូទាត់</span><span>បង់ប្រាក់ពេលទទួលទំនិញ</span></div>
      <div class="success-row"><span>ការដឹកជញ្ជូនប៉ាន់ស្មាន</span><span>2&ndash;3 ថ្ងៃធ្វើការ</span></div>
      <div class="success-row"><span>ចំនួនទឹកប្រាក់សរុប</span><span id="orderTotal">$0.00</span></div>
    </div>

    <div class="success-actions">
      <button class="btn btn--primary" onclick="location.href='home.html'">ត្រឡប់ទៅទំព័រដើម</button>
      <button class="btn btn--outline" onclick="location.href='catalog.html'">បន្តទិញឥវ៉ាន់</button>
    </div>
  </div>

  <script src="src/js/shop.js"></script>
  <script>
    (function () {
      var cart = window.MiniShop.cart;
      var subtotal = cart.reduce(function (sum, line) {
        var product = window.MiniShop.findProduct(line.productId);
        return product ? sum + product.price * line.qty : sum;
      }, 0);
      document.getElementById("orderTotal").textContent = "$" + (subtotal + 1.5).toFixed(2);
      document.getElementById("orderNo").textContent = "#MS-" + Math.floor(20000000 + Math.random() * 9999999);
    })();
  </script>
</body>
</html>
