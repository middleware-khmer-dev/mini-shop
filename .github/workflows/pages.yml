name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main, mini-shop-uat]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          # the Python backend in backend/ (products, orders, invoice host). Set the repository variable BACKEND_URL
          # (Settings > Secrets and variables > Actions > Variables) to its https address, e.g. https://api.example.com.
          # Until it is set the app still uses the old Cloudflare Worker.
          EXPO_PUBLIC_INVOICE_API: ${{ vars.BACKEND_URL || 'https://mini-shop-invoices.infra-deploy-domain.workers.dev' }}
          EXPO_PUBLIC_PRODUCTS_URL: ${{ format('{0}/products', vars.BACKEND_URL || 'https://mini-shop-api.infra-deploy-domain.workers.dev') }}
          EXPO_PUBLIC_ORDERS_API: ${{ vars.BACKEND_URL || 'https://mini-shop-api.infra-deploy-domain.workers.dev' }}
      # Pages serves 404.html for unknown paths; reuse index.html so deep links work
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: native/dist
      - id: deployment
        uses: actions/deploy-pages@v4
